name: Sync HeyCatch Blog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync articles from HeyCatch API
        env:
          HEYCATCH_API_KEY: hck_lv_c8fc952c1efb370b5f7aa1f4
        run: node scripts/sync-blog.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog blog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Sync published articles from HeyCatch API"
            git push origin main
          fi
