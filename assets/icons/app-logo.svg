<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 128 1792 1792" width="2048" height="2048">
  <defs>
    <linearGradient id="bgGradHiRes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4d75"/>
      <stop offset="100%" stop-color="#112d46"/>
    </linearGradient>
    <linearGradient id="penGradHiRes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c5d8ea"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background filling 100% of the icon canvas with no white border -->
  <rect x="128" y="128" width="1792" height="1792" fill="url(#bgGradHiRes)"/>

  <!-- Notebook Spine & Body -->
  <!-- Back cover / page edge accent -->
  <rect x="544" y="464" width="992" height="1120" rx="96" fill="#2d6491" opacity="0.4"/>
  <!-- Front notebook cover -->
  <rect x="496" y="432" width="992" height="1120" rx="96" fill="#ffffff"/>

  <!-- Notebook Spine detail -->
  <path d="M 496,528 C 496,474.8 538.8,432 592,432 L 704,432 L 704,1552 L 592,1552 C 538.8,1552 496,1509.2 496,1456 Z" fill="#e2ecf5"/>
  <line x1="704" y1="432" x2="704" y2="1552" stroke="#cbdbe8" stroke-width="8"/>

  <!-- E-ink dot matrix pattern on notebook page -->
  <g fill="#1e4d75" opacity="0.35">
    <circle cx="856" cy="656" r="14"/>
    <circle cx="960" cy="656" r="14"/>
    <circle cx="1064" cy="656" r="14"/>
    <circle cx="1168" cy="656" r="14"/>
    <circle cx="1272" cy="656" r="14"/>

    <circle cx="856" cy="768" r="14"/>
    <circle cx="960" cy="768" r="14"/>
    <circle cx="1064" cy="768" r="14"/>
    <circle cx="1168" cy="768" r="14"/>
    <circle cx="1272" cy="768" r="14"/>

    <circle cx="856" cy="880" r="14"/>
    <circle cx="960" cy="880" r="14"/>
    <circle cx="1064" cy="880" r="14"/>
    <circle cx="1168" cy="880" r="14"/>
    <circle cx="1272" cy="880" r="14"/>
  </g>

  <!-- Clean ruled/sketched notes gesture -->
  <path d="M 848 1056 C 940 1032, 1020 1072, 1120 1048 C 1200 1028, 1260 1052, 1328 1040" stroke="#1e4d75" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 848 1184 C 960 1168, 1080 1192, 1220 1172" stroke="#1e4d75" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Stylus / Digital Pen Crossing -->
  <g transform="rotate(-38 1160 1120)">
    <!-- Pen Body Shadow -->
    <rect x="1096" y="376" width="112" height="920" rx="56" fill="#000000" opacity="0.18"/>
    <!-- Pen Body -->
    <rect x="1088" y="360" width="112" height="896" rx="56" fill="#1b4366"/>
    <!-- Pen Grip & Accent ring -->
    <rect x="1088" y="936" width="112" height="168" fill="#2d6491"/>
    <rect x="1088" y="920" width="112" height="16" fill="#7ba5cb"/>
    <rect x="1088" y="520" width="16" height="192" rx="8" fill="#ffffff" opacity="0.3"/>
    <!-- Pen Cone / Tip -->
    <polygon points="1088,1256 1200,1256 1144,1384" fill="#3a5166"/>
    <!-- Nib tip dot -->
    <circle cx="1144" cy="1392" r="12" fill="#112d46"/>
  </g>

  <!-- Subtle spark / creation accent -->
  <path d="M 1560 480 Q 1560 540 1620 540 Q 1560 540 1560 600 Q 1560 540 1500 540 Q 1560 540 1560 480 Z" fill="#9ec5e8"/>
</svg>
